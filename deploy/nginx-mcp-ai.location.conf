# Paste these location blocks INSIDE the existing
# `server { server_name mcp.winbit32.com; listen 443 ssl; … }` block in
# /etc/nginx/sites-available/mcp.winbit32.com.conf, ABOVE the catch-all
# `location / { … 8821 (MCP) }`.
#
# They route the REST + x402 + hosted-AI surface to the REST unit on 8820 while
# everything else (the MCP Streamable HTTP transport) keeps going to 8821. nginx
# matches the most specific prefix, so ordering within the file does not matter,
# but keeping them above `location /` documents intent.

# Hosted AI: credit bundles (x402) + OpenAI-compatible proxy + balance/models.
location /v1/ai {
	proxy_pass http://127.0.0.1:8820;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_read_timeout 300s;   # model calls can be slow
	proxy_send_timeout 300s;
	proxy_connect_timeout 60s;
}

# Other paid REST surfaces + x402 discovery (optional but handy).
location /v1/q {
	proxy_pass http://127.0.0.1:8820;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-Proto $scheme;
}
location /v1/private {
	proxy_pass http://127.0.0.1:8820;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-Proto $scheme;
}
location = /v1/paywall {
	proxy_pass http://127.0.0.1:8820;
	proxy_set_header Host $host;
}
location = /.well-known/x402 {
	proxy_pass http://127.0.0.1:8820;
	proxy_set_header Host $host;
}
