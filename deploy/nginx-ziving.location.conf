# Snippet for mcp.winbit32.com — REST paths that must hit :8820 (not MCP :8821).
# Merge into the live vhost; ^~ so they win over the catch-all MCP location.
#
#   location ^~ /v1/overlay { … proxy_pass http://127.0.0.1:8820; … }
#   location ^~ /v1/ziving  { … proxy_pass http://127.0.0.1:8820; … }
#
# Same headers/timeouts as the existing /v1/unlock and /v1/zec blocks.

location ^~ /v1/overlay {
	proxy_pass http://127.0.0.1:8820;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_read_timeout 120s;
	proxy_send_timeout 120s;
	proxy_connect_timeout 60s;
}

location ^~ /v1/ziving {
	proxy_pass http://127.0.0.1:8820;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_read_timeout 120s;
	proxy_send_timeout 120s;
	proxy_connect_timeout 60s;
}
